name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  PHP_EXTENSIONS: mbstring, intl, pdo_mysql, bcmath, redis, gd, zip

jobs:
  quality:
    name: Test, Pint, PHPStan
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pvt_test
          MYSQL_USER: pvt
          MYSQL_PASSWORD: pvt
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cài thư viện PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Laravel Pint (định dạng code)
        run: vendor/bin/pint --test

      - name: PHPStan (bắt lỗi kiểu dữ liệu)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Test tự động
        run: php artisan test

  browser:
    name: Trình duyệt thật (tắt JavaScript)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pvt_browser
          MYSQL_USER: pvt
          MYSQL_PASSWORD: pvt
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cài thư viện
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npx playwright install --with-deps chromium

      - name: Build CSS theme
        run: npm run build

      - name: Chuẩn bị ứng dụng và dữ liệu mẫu
        run: |
          cp .env.example .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=pvt_browser/; s/^DB_USERNAME=.*/DB_USERNAME=pvt/; s/^DB_PASSWORD=.*/DB_PASSWORD=pvt/; s/^FORCE_HTTPS=.*/FORCE_HTTPS=false/' .env
          php artisan key:generate
          php artisan migrate --force --seed --seeder='Database\Seeders\DemoSiteSeeder'

      - name: Chạy ứng dụng
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000/up && break; sleep 1; done

      - name: Kiểm tra tắt JavaScript
        run: node tests/Browser/no-javascript.mjs
        env:
          APP_ORIGIN: http://127.0.0.1:8000

      - name: Log khi lỗi
        if: failure()
        run: tail -n 100 storage/logs/*.log
